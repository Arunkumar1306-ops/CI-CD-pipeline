name : CI/CD
on:
  push:
     branches:
           - feature

jobs:
   compile:
       runs-on: ubuntu-latest

       steps:
       - uses: actions/checkout@v4

       - name: java- jdk installation
         uses: actions/setup-java@v6
         with:
           distribution: temurin
           java-version: '17'
           cache: maven
       - run: java --version

       # Build & Unit Tests (Maven)
       - name: Build with Maven
         run: mvn clean install

       - name: Run Unit Tests
         run: mvn test

